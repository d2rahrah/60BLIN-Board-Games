<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Disco Chat</title>

<style>
:root{
    --bg:#05060a;
    --panel:#101320;
    --accent:#4af2a1;
    --text:#f5f7ff;
    --muted:#8b90a5;
    --border:#22263a;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat{
    width:700px;
    height:800px;

    background:linear-gradient(
        145deg,
        #0b0e18,
        #05060a
    );

    border:1px solid var(--border);
    border-radius:12px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    box-shadow:
        0 0 0 1px #000,
        0 20px 50px #000;
}

.header{
    padding:14px;
    border-bottom:1px solid var(--border);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    color:var(--accent);
    letter-spacing:.15em;
    text-transform:uppercase;
}

.status{
    color:var(--muted);
    font-size:12px;
}

/* CHAT AREA */

.messages{
    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;
    flex-direction:column;
    gap:10px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:8px;
}

.messages::-webkit-scrollbar-thumb{
    background:#222;
    border-radius:999px;
}

.msg{
    max-width:80%;
    padding:10px 14px;

    border:1px solid var(--border);
    border-radius:10px;

    background:#111622;

    word-wrap:break-word;
}

.self{
    align-self:flex-end;

    background:#0f241c;
    border-color:#194d39;
}

.other{
    align-self:flex-start;
}

/* INPUT */

.footer{
    padding:14px;

    border-top:1px solid var(--border);

    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;

    background:#0b0f1c;
    border:1px solid var(--border);
    border-radius:10px;

    color:white;
}

button{
    padding:12px 18px;

    border:none;
    border-radius:10px;

    background:var(--accent);
    color:black;

    cursor:pointer;
    font-weight:bold;
}

button:hover{
    filter:brightness(1.1);
}
</style>
</head>
<body>

<div class="chat">

    <div class="header">
        <div class="title">Disco Chat</div>
        <div class="status">ONLINE</div>
    </div>

    <div class="messages" id="messages">

        <div class="msg other">
            Welcome to Disco.
        </div>
    <div class="msg">
        <span class="time">21:44</span>
        <span class="user">rah</span>
        wheat price reached 14 gold
    </div>
    
        <div class="msg self">
            Hello world.
        </div>

    </div>

    <div class="footer">
        <input
            id="messageInput"
            placeholder="Type message..."
        >

        <button onclick="sendMessage()">
            SEND
        </button>
    </div>

</div>

<script>

const messages =
document.getElementById("messages");

const input =
document.getElementById("messageInput");

let autoScroll = true;

/* Detect if user scrolled up */

messages.addEventListener("scroll", () => {

    const distance =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight;

    autoScroll = distance < 100;
});

function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    const div =
        document.createElement("div");

    div.className = "msg self";
    div.textContent = text;

    messages.appendChild(div);

    input.value = "";

    if(autoScroll){
        messages.scrollTop =
            messages.scrollHeight;
    }
}

input.addEventListener(
    "keydown",
    e => {
        if(e.key === "Enter"){
            sendMessage();
        }
    }
);

</script>

</body>
</html>
